<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberNorth Games | Grand Real City Auto 2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgba(9, 3, 18, 0.88), rgba(4, 1, 8, 0.96)), url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Üst Menü */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            background: rgba(9, 3, 18, 0.85);
            border-bottom: 1px solid rgba(255, 0, 127, 0.25);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00f3ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: #d0c4e8;
            text-decoration: none;
            margin-left: 24px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
        }

        /* Ana Hero Alanı */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        .retro-sun {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: linear-gradient(180deg, #ffbe0b 0%, #ff007f 60%, #8338ec 100%);
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.2;
            filter: blur(3px);
            z-index: 0;
        }

        .badge {
            display: inline-block;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 6px 18px;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(28px, 4.5vw, 50px);
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.8), 0 0 45px rgba(255, 0, 127, 0.4);
        }

        .subtitle {
            color: #b8a9d6;
            font-size: 16px;
            max-width: 550px;
            margin: 0 auto 30px;
            position: relative;
            z-index: 1;
        }

        /* Geri Sayım Alanları */
        .countdown-container {
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .countdown-title {
            font-family: 'Orbitron', sans-serif;
            color: #ffbe0b;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(18, 6, 36, 0.85);
            border: 2px solid #ff007f;
            border-radius: 10px;
            min-width: 75px;
            padding: 12px 6px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.35);
        }

        .time-box span {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
        }

        .time-box small {
            display: block;
            margin-top: 3px;
            font-size: 9px;
            letter-spacing: 1px;
            color: #ff66b2;
            font-weight: 700;
        }

        /* Genel Bölüm Stilleri */
        .section-container {
            padding: 50px 8%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 18px rgba(0, 243, 255, 0.6);
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        /* Karakterler Vitrini */
        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .char-card {
            background: rgba(17, 7, 34, 0.9);
            border: 1px solid rgba(255, 0, 127, 0.4);
            border-radius: 16px;
            overflow: hidden;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.2);
        }

        .char-card:hover {
            transform: translateY(-5px);
            border-color: #00f3ff;
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.3);
        }

        .char-img {
            width: 100%;
            height: 280px;
            background: #110522;
            object-fit: cover;
            border-bottom: 2px solid rgba(255, 0, 127, 0.3);
        }

        .char-info {
            padding: 20px;
        }

        .char-info h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: #ffbe0b;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .char-info p {
            color: #cbbbe8;
            font-size: 15px;
            line-height: 1.6;
        }

        /* Oyun Özellikleri (Kartlar) */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .feature-box {
            background: rgba(15, 5, 30, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .feature-box h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: #00f3ff;
            margin-bottom: 10px;
        }

        .feature-box p {
            color: #b8a9d6;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Sistem Gereksinimleri */
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .spec-card {
            background: rgba(12, 4, 24, 0.9);
            border: 1px solid rgba(255, 190, 11, 0.4);
            border-radius: 14px;
            padding: 25px;
        }

        .spec-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: #ffbe0b;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 190, 11, 0.2);
            padding-bottom: 8px;
        }

        .spec-card ul {
            list-style: none;
            color: #d0c4e8;
            font-size: 15px;
            line-height: 2;
        }

        /* Mağaza Bölümü */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: rgba(17, 7, 34, 0.92);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 16px;
            padding: 30px 24px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: #ff007f;
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.35);
        }

        .card.featured {
            border: 2px solid #ffbe0b;
            box-shadow: 0 0 25px rgba(255, 190, 11, 0.25);
        }

        .card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .price {
            font-family: 'Orbitron', sans-serif;
            font-size: 30px;
            font-weight: 900;
            color: #ffbe0b;
            margin-bottom: 18px;
        }

        .card ul {
            list-style: none;
            color: #cbbbe8;
            margin-bottom: 26px;
            line-height: 2
